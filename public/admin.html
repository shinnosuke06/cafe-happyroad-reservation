<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>予約管理 | cafe ハッピーロード</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/admin.js"></script>
</head>
<body class="staff">
  <!-- ログイン -->
  <div class="login" id="login-view" hidden>
    <form class="card login-card" id="login-form" novalidate>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h12v4a6 6 0 0 1-12 0z"/><path d="M16 10h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M8 3c-.8 1.2.8 2 0 3.2M12 3c-.8 1.2.8 2 0 3.2"/><path d="M4 21h12"/></svg>
        </span>
        <span>
          <span class="brand-name" data-store-name>cafe ハッピーロード</span>
          <span class="brand-sub">スタッフ用</span>
        </span>
      </div>
      <h1>予約管理にログイン</h1>
      <label class="field">
        <span>パスワード</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <p class="form-error" id="login-error" role="alert"></p>
      <button class="btn btn-primary btn-block" type="submit">ログイン</button>
    </form>
  </div>

  <!-- 管理画面 -->
  <div id="app-view" hidden>
    <header class="admin-header">
      <div class="admin-bar">
        <a class="brand" href="/admin">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h12v4a6 6 0 0 1-12 0z"/><path d="M16 10h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M8 3c-.8 1.2.8 2 0 3.2M12 3c-.8 1.2.8 2 0 3.2"/><path d="M4 21h12"/></svg>
          </span>
          <span>
            <span class="brand-name" data-store-name>cafe ハッピーロード</span>
            <span class="brand-sub">予約管理</span>
          </span>
        </a>
        <nav class="tabs" role="tablist" aria-label="メニュー" id="tabs"></nav>
        <button type="button" class="btn btn-sm" id="logout">ログアウト</button>
      </div>
    </header>

    <main class="admin-main">
      <section data-panel="book" role="tabpanel" id="panel-book"></section>
      <section data-panel="menu" role="tabpanel" id="panel-menu" hidden></section>
      <section data-panel="customers" role="tabpanel" id="panel-customers" hidden></section>
      <section data-panel="messages" role="tabpanel" id="panel-messages" hidden></section>
      <section data-panel="settings" role="tabpanel" id="panel-settings" hidden></section>
    </main>
  </div>
</body>
</html>
