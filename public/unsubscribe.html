<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>メール配信の停止 | cafe ハッピーロード</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/unsubscribe.js"></script>
</head>
<body class="public">
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="/"><span class="brand-name">cafe ハッピーロード</span></a>
    </div>
  </header>
  <main class="wrap">
    <section class="card done" id="box">
      <h1>メールのお知らせを止めますか？</h1>
      <p class="lead" id="message">下のボタンを押すと、お休みなどのお知らせメールが届かなくなります。<br>（ご予約の確認メールは、これまでどおりお送りします）</p>
      <p class="form-error" id="error" role="alert"></p>
      <button class="btn btn-primary btn-block" type="button" id="stop">お知らせメールを止める</button>
      <a class="btn btn-block" href="/">予約ページへ</a>
    </section>
  </main>
</body>
</html>
